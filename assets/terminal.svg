<svg width="840" height="400" viewBox="0 0 840 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="840" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>

    <clipPath id="c1"><rect x="36" y="76" height="24" width="0">
      <animate attributeName="width" from="0" to="240" begin="0.4s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="36" y="102" height="24" width="0">
      <animate attributeName="width" from="0" to="710" begin="1.3s" dur="1.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="36" y="144" height="24" width="0">
      <animate attributeName="width" from="0" to="300" begin="3.2s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="36" y="170" height="24" width="0">
      <animate attributeName="width" from="0" to="700" begin="4.2s" dur="1.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="36" y="212" height="24" width="0">
      <animate attributeName="width" from="0" to="290" begin="5.9s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="36" y="238" height="24" width="0">
      <animate attributeName="width" from="0" to="480" begin="6.9s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c7"><rect x="36" y="264" height="24" width="0">
      <animate attributeName="width" from="0" to="480" begin="7.8s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c8"><rect x="36" y="290" height="24" width="0">
      <animate attributeName="width" from="0" to="430" begin="8.7s" dur="0.9s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- gradient glow border -->
  <rect x="10.5" y="10.5" width="819" height="379" rx="14" stroke="url(#glow)" stroke-opacity="0.75" stroke-width="1.5"/>

  <!-- terminal body -->
  <rect x="12" y="12" width="816" height="376" rx="12" fill="#0d1117"/>

  <!-- title bar -->
  <path d="M12 24C12 17.4 17.4 12 24 12H816C822.6 12 828 17.4 828 24V52H12V24Z" fill="#161b22"/>
  <circle cx="36" cy="32" r="6.5" fill="#ff5f56"/>
  <circle cx="58" cy="32" r="6.5" fill="#ffbd2e"/>
  <circle cx="80" cy="32" r="6.5" fill="#27c93f"/>
  <text x="420" y="37" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="13" fill="#8b949e">amine@lemaizi — zsh</text>

  <g font-family="ui-monospace,'Cascadia Code',Menlo,Consolas,monospace" font-size="15">

    <!-- $ whoami -->
    <text x="40" y="93" clip-path="url(#c1)"><tspan fill="#3fb950">amine@lemaizi</tspan><tspan fill="#58a6ff"> ~</tspan><tspan fill="#8b949e"> %</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
    <text x="40" y="119" clip-path="url(#c2)" fill="#8b949e">Machine Learning Engineer · applied math at heart · systems builder by trade</text>

    <!-- $ cat stack.txt -->
    <text x="40" y="161" clip-path="url(#c3)"><tspan fill="#3fb950">amine@lemaizi</tspan><tspan fill="#58a6ff"> ~</tspan><tspan fill="#8b949e"> %</tspan><tspan fill="#e6edf3"> cat stack.txt</tspan></text>
    <text x="40" y="187" clip-path="url(#c4)" fill="#79c0ff">ml-engineering · mlops · gcp · statistical-modeling · forecasting · python</text>

    <!-- $ ./ship now -->
    <text x="40" y="229" clip-path="url(#c5)"><tspan fill="#3fb950">amine@lemaizi</tspan><tspan fill="#58a6ff"> ~</tspan><tspan fill="#8b949e"> %</tspan><tspan fill="#e6edf3"> ./ship --now</tspan></text>
    <text x="40" y="255" clip-path="url(#c6)"><tspan fill="#bc8cff">→ </tspan><tspan fill="#e6edf3">Coded Flows</tspan><tspan fill="#8b949e"> — visual Python workflow platform</tspan></text>
    <text x="40" y="281" clip-path="url(#c7)"><tspan fill="#bc8cff">→ </tspan><tspan fill="#e6edf3">freelance</tspan><tspan fill="#8b949e"> — ML infrastructure, models &amp; training</tspan></text>
    <text x="40" y="307" clip-path="url(#c8)"><tspan fill="#bc8cff">→ </tspan><tspan fill="#8b949e">fewer slide decks, more shipped systems </tspan><tspan fill="#3fb950">✓</tspan></text>

    <!-- final prompt + blinking cursor -->
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="9.8s" fill="freeze"/>
      <text x="40" y="349"><tspan fill="#3fb950">amine@lemaizi</tspan><tspan fill="#58a6ff"> ~</tspan><tspan fill="#8b949e"> %</tspan></text>
      <rect x="205" y="335" width="9" height="18" fill="#e6edf3">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
